services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indusai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=sqlite:///./storage/indusai.db
      - STORAGE_DIR=./storage
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - INTERNAL_SERVICE_KEY=indusai-internal-worker-key-dev
      - MAX_FILE_SIZE_MB=50
      - SYNC_QUERY_TIMEOUT_SEC=15
    volumes:
      - ./backend/storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
