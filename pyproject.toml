[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indusai-x"
version = "1.0.0"
description = "Sovereign On-Premise Agentic AI Workbench for MRPL (SIH26117)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.0",
    "langchain-core>=1.6.0",
    "chromadb>=1.5.0",
    "sentence-transformers>=5.0.0",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "duckdb>=1.0.0",
    "sqlglot>=20.0.0",
    "networkx>=3.0.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
